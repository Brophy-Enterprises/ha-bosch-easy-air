name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run hassfest
        if: ${{ hashFiles('custom_components/bosch_easyair/manifest.json') != '' }}
        uses: home-assistant/actions/hassfest@master

      - name: Skip until integration is added
        if: ${{ hashFiles('custom_components/bosch_easyair/manifest.json') == '' }}
        run: echo "Skipping hassfest until custom_components/bosch_easyair/manifest.json exists."
