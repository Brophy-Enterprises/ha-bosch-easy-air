name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run hassfest
        if: ${{ hashFiles('custom_components/*/manifest.json') != '' }}
        uses: home-assistant/actions/hassfest@master

      - name: Skip until integration is added
        if: ${{ hashFiles('custom_components/*/manifest.json') == '' }}
        run: echo "Skipping hassfest until custom_components/*/manifest.json exists."
